<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="每天记录各账户余额，自动计算总资产、日收益和收益率。数据只保存在本机。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="资产收盘">
  <meta name="format-detection" content="telephone=no">
  <title>资产收盘</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="stylesheet" href="./css/app.css">

  <script>
    // 在样式加载前先定好主题，避免深色模式刷新时白闪。
    (function () {
      try {
        var raw = localStorage.getItem('assetTracker.data');
        var theme = 'system';
        if (raw) {
          var data = JSON.parse(raw);
          if (data && data.settings && data.settings.theme) theme = data.settings.theme;
        }
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
        var dark = theme === 'dark' || (theme === 'system' &&
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0f1115' : '#f5f6f8');
      } catch (e) { /* 忽略，交给主程序处理 */ }
    })();
  </script>
</head>
<body>
  <div id="app-loading" class="loading">
    <div class="loading__mark">¥</div>
    <p>正在打开资产收盘…</p>
  </div>

  <main id="app" class="app-main" hidden></main>

  <nav class="tabbar" aria-label="主导航">
    <div class="tabbar__inner">
      <a class="tab" href="#/home" data-tab="home" aria-label="首页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        <span>首页</span>
      </a>
      <a class="tab" href="#/record" data-tab="record" aria-label="记录">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="m14.5 7.5 3 3"/></svg>
        <span>记录</span>
      </a>
      <a class="tab" href="#/history" data-tab="history" aria-label="历史">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 4-4 3 3 5-6"/></svg>
        <span>历史</span>
      </a>
      <a class="tab" href="#/settings" data-tab="settings" aria-label="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="11" cy="17" r="2"/></svg>
        <span>设置</span>
      </a>
    </div>
  </nav>

  <div id="toast-root"></div>

  <noscript>
    <div class="noscript">这个网页需要开启 JavaScript 才能使用。</div>
  </noscript>

  <script>
    setTimeout(function () {
      var loading = document.getElementById('app-loading');
      if (loading) {
        var text = loading.querySelector('p');
        if (text) text.textContent = '加载时间较长，请检查网络后刷新页面。';
      }
    }, 10000);
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
